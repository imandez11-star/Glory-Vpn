name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build_apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Create & Build Native APK
        run: |
          flutter create --platforms android --org com.gloryraft app_dir
          echo "" | base64 -d > app_dir/lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' app_dir/android/app/src/main/AndroidManifest.xml
          cd app_dir
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GloryRaft-Android-APK
          path: app_dir/build/app/outputs/flutter-apk/app-release.apk
