name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_main.py'
      - '.github/workflows/build_apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build APK with Flet
        run: |
          pip install --upgrade pip
          pip install "flet==0.24.1" requests
          mkdir -p app_build
          cp mobile_main.py app_build/main.py
          printf "flet==0.24.1\nrequests\n" > app_build/requirements.txt
          cd app_build
          flet build apk --yes --verbose

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GloryRaft-Android-APK
          path: app_build/build/apk/*.apk
