name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_main.dart'
      - '.github/workflows/build_apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.1'
          channel: 'stable'

      - name: Create & Build Native APK
        run: |
          flutter create --platforms android --org com.gloryraft app_dir
          cp mobile_main.dart app_dir/lib/main.dart
          python3 -c '
          p = "app_dir/android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          if "INTERNET" not in s:
              s = s.replace("<application", "<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application", 1)
              open(p, "w").write(s)
          '
          cd app_dir
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GloryRaft-Android-APK
          path: app_dir/build/app/outputs/flutter-apk/app-release.apk
