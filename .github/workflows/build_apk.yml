name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile_main.dart'
      - '.github/workflows/build_apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create & Build Native Flutter APK
        run: |
          flutter create --org com.gloryraft --project-name gloryraft_sub app_dir
          cd app_dir
          flutter pub add http
          cp ../mobile_main.dart lib/main.dart
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/g' android/app/src/main/AndroidManifest.xml
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GloryRaft-Android-APK
          path: app_dir/build/app/outputs/flutter-apk/app-release.apk
